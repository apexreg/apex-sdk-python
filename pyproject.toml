[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexreg-sdk"
version = "0.1.0"
description = "Python SDK for ApexRegistry (resolve, search, register agents)"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.24.0"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["apexreg_sdk*"]
